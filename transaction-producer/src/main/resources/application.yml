server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: transaction-producer

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

app:
  kafka:
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    transactions-raw-topic: transactions.raw
    publish-timeout-seconds: 5
  idempotency:
    ttl-hours: 24
  performance:
    # ── Kafka Producer Tuning ────────────────────────────────────────
    # linger.ms=0 → lowest latency (each request flushed immediately)
    # linger.ms=5 → batches requests within 5ms window → ~30% throughput gain under load
    # producer-linger-ms: ${KAFKA_PRODUCER_LINGER_MS:5}         # override via KafkaProducerConfig
    # producer-batch-size: ${KAFKA_PRODUCER_BATCH_SIZE:16384}   # 16KB default; 64KB for high TPS
    # producer-compression-type: snappy                         # ~40% size reduction

  security:
    # Min 32 chars (256 bit) for HS256. Override via JWT_SECRET_KEY env var in production.
    jwt:
      secret: ${JWT_SECRET_KEY:dev-jwt-secret-changeme-minimum-32-bytes!!}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  level:
    com.transactionshield: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
