server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: transaction-producer

  kafka:
    bootstrap-servers: localhost:9092

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

app:
  kafka:
    schema-registry-url: http://localhost:8081
    transactions-raw-topic: transactions.raw
    publish-timeout-seconds: 5
  idempotency:
    ttl-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.transactionshield: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
