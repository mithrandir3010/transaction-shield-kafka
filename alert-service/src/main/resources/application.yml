server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: alert-service

  # ── Kafka ─────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alert-service-consumer-group
      # ConsumerFactory, ack-mode and error handler configured in KafkaConsumerConfig.java
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

  # ── PostgreSQL ────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/transactionshield
    username: tsuser
    password: tspassword
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_alert_service

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Jackson ───────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── App-specific properties ─────────────────────────────────────────
app:
  kafka:
    transactions-scored-topic: transactions.scored
    transactions-dlq-topic:    transactions.dlq
    alerts-created-topic:      alerts.created
    publish-timeout-seconds:   5
    schema-registry-url:       http://localhost:8081

  alert:
    # Risk levels that trigger an AlertCreatedEvent (downstream notification hook)
    # Override via env var: APP_ALERT_NOTIFY-RISK-LEVELS=CRITICAL
    notify-risk-levels: HIGH,CRITICAL

  dlq:
    replay:
      # Max times a TRANSIENT message may be replayed before it is quarantined
      max-replay-attempts: 3
      # How long to wait for new messages in a single poll() call (seconds)
      poll-timeout-seconds: 10

# ── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

# ── Logging ─────────────────────────────────────────────────────────
logging:
  level:
    com.transactionshield: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.springframework.retry: DEBUG    # shows each retry attempt
    org.hibernate.SQL: WARN
