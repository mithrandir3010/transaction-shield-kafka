server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: fraud-engine

  # ── Kafka ─────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-engine-consumer-group
      # auto-offset-reset and enable.auto.commit are set in KafkaConsumerConfig.java
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

  # ── Redis ─────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          min-idle: 2

  # ── PostgreSQL ────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transactionshield}
    username: ${DB_USERNAME:tsuser}
    password: ${DB_PASSWORD:tspassword}
    hikari:
      # Pool sizing: (cpu_cores * 2) + effective_spindle_count
      # ECS 2-vCPU + SSD → 5 ideal; use 10 for burst headroom.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Keepalive prevents idle connections from being closed by PG's tcp_keepalives
      keepalive-time: 30000
      # Set to 60000 (60s) in production to detect and log connection leaks early
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:0}
      pool-name: fraud-engine-hikari-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_fraud_engine

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # ── Jackson ───────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# ── App-specific properties ─────────────────────────────────────────
app:
  kafka:
    transactions-raw-topic:    transactions.raw
    transactions-scored-topic: transactions.scored
    transactions-dlq-topic:    transactions.dlq
    publish-timeout-seconds:   5
    schema-registry-url:       ${SCHEMA_REGISTRY_URL:http://localhost:8081}

  idempotency:
    scoring:
      ttl-hours: 24

  rules:
    # How often to reload rule configs and experiments from DB (ms).
    refresh-interval-ms: 300000

    # Legacy YAML thresholds kept as application-level fallbacks.
    # The authoritative values live in fraud_rules.parameters (DB).
    high-amount:
      threshold: 10000
    blacklisted-countries: RU,KP,IR,SY,CU
    night-hours:
      start: 0
      end: 5
    velocity:
      window-seconds: 60
      medium-threshold: 3
      high-threshold: 5
      medium-score: 40
      high-score: 80

  performance:
    # ── Kafka Consumer Tuning ────────────────────────────────────────
    # consumer-concurrency: must equal transactions.raw partition count.
    # Increasing beyond partitions wastes threads (excess threads stay idle).
    # Scale-out: increase partitions + concurrency together.
    # consumer-concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}  # override via KafkaConsumerConfig @Value
    #
    # max-poll-records: 10 = lowest latency; 500 = highest throughput.
    # Alert if consumer lag > (max-poll-records * 10) to trigger scale-out.
    # max-poll-records: ${KAFKA_MAX_POLL_RECORDS:100}       # override via KafkaConsumerConfig @Value
    #
    # ── DB Pool Sizing Guide ─────────────────────────────────────────
    # Formula: (cpu_cores * 2) + spindle_count
    # 2-vCPU ECS, SSD (spindle=1) → ideal = 5, using 10 for burst headroom.
    # Must be >= consumer-concurrency + rule-refresh thread + actuator threads.
    # DB_POOL_MAX_SIZE: 10   (set via env var)
    # DB_LEAK_DETECTION_MS: 60000   (enable in prod to catch leaked connections)

  security:
    # Internal API key for /api/v1/rules/** operator endpoints.
    # Override via INTERNAL_API_KEY env var in production.
    internal-api-key: ${INTERNAL_API_KEY:internal-dev-key-change-in-production}

# ── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

# ── Logging ─────────────────────────────────────────────────────────
logging:
  level:
    com.transactionshield: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.hibernate.SQL: WARN
